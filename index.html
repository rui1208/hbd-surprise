<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Challenge!</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      display: none; /* パスワード認証完了まで非表示 */
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(56, 189, 248, 0.2);
      animation: fadeIn 0.8s ease-out;
    }

    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    h1 { color: #f1f5f9; font-size: 1.5rem; margin-bottom: 15px; }
    p { color: #94a3b8; margin-bottom: 25px; line-height: 1.7; font-size: 0.95rem; }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      background: #0f172a;
      border: 2px solid #334155;
      color: #fff;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      margin-bottom: 15px;
      text-align: center;
    }
    input[type="text"]:focus { border-color: #38bdf8; }

    .btn-submit {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 25px;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
      transition: transform 0.2s, background 0.2s;
    }
    .btn-submit:hover { background: #7dd3fc; transform: translateY(-2px); }

    #escape-btn {
      position: absolute;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 24px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4);
      transition: left 0.2s ease, top 0.2s ease, background 0.3s;
      z-index: 1000;
      white-space: nowrap;
    }

    .hidden { display: none !important; }
    .error { color: #f87171; font-size: 0.85rem; margin-top: -8px; margin-bottom: 15px; }
    .fade-in { animation: fadeIn 0.6s ease-out forwards; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card" id="main-card">
    
    <!-- 謎解きステージ -->
    <div id="quiz-stage">
      <span class="badge" id="quiz-badge">QUESTION 01 / 05</span>
      <h1 id="quiz-title">思い出クイズ</h1>
      <p id="quiz-question">クイズの問題文</p>
      
      <input type="text" id="answer-input" placeholder="ここに入力してね">
      <div id="error-msg" class="error hidden">ちがうよ！もう一度思い出してみて！</div>
      <button class="btn-submit" onclick="checkAnswer()">答える</button>
    </div>

    <!-- クリア画面 -->
    <div id="message-stage" class="hidden fade-in">
      <span class="badge">ALL CLEAR!</span>
      <h1>全問正解！🎉</h1>
      <p>すごい！全問大正解です！<br>準備ができたら下のボタンを押してね。</p>
      
      <button id="escape-btn" onclick="finalClick()">ここをクリックして！</button>
    </div>

  </div>

  <script>
    // 1. パスワード保護（合言葉機能）
    const SECRET_PASSWORD = "1015"; // ←2人だけの合言葉を設定

    function authenticate() {
      const inputPass = prompt("【合言葉を入力してください】\n2人の特別な数字4桁は？");

      if (inputPass === SECRET_PASSWORD) {
        sessionStorage.setItem("authenticated", "true");
        document.body.style.display = "flex";
        loadQuiz();
      } else if (inputPass === null) {
        document.body.innerHTML = "<div style='color:#fff; text-align:center; font-family:sans-serif;'>アクセスがキャンセルされました。</div>";
        document.body.style.display = "block";
      } else {
        alert("合言葉が違います。");
        authenticate();
      }
    }

    // 2. クイズデータ
    const quizData = [
      {
        question: "俺たちが初めて一緒に旅行に行った場所はどこでしょう？<br><small style='color: #64748b;'>（ヒント：ひらがな）</small>",
        answers: ["あたみ", "熱海"]
      },
      {
        question: "初めてのデートで一緒に食べた食べものは何でしょう？<br><small style='color: #64748b;'>（ヒント：カタカナ）</small>",
        answers: ["パスタ", "スパゲティ"]
      },
      {
        question: "2人でよく行くお気に入りのカフェはどこでしょう？<br><small style='color: #64748b;'>（ヒント：カタカナ）</small>",
        answers: ["スタバ", "スターバックス"]
      },
      {
        question: "ドライブで夜景を見に行った場所はどこでしょう？<br><small style='color: #64748b;'>（ヒント：ひらがな または 漢字）</small>",
        answers: ["みなとみらい", "横浜"]
      },
      {
        question: "最後！彼女の誕生日は何月何日でしょう？<br><small style='color: #64748b;'>（ヒント：数字4桁 例:1015）</small>",
        answers: ["1015"]
      }
    ];

    let currentStep = 0;
    let escapeCount = 0;

    function loadQuiz() {
      const q = quizData[currentStep];
      document.getElementById('quiz-badge').innerText = `QUESTION 0${currentStep + 1} / 05`;
      document.getElementById('quiz-question').innerHTML = q.question;
      document.getElementById('answer-input').value = '';
      document.getElementById('error-msg').classList.add('hidden');
    }

    function checkAnswer() {
      const input = document.getElementById('answer-input').value.trim();
      const errorMsg = document.getElementById('error-msg');
      const q = quizData[currentStep];

      if (q.answers.includes(input)) {
        currentStep++;
        confetti({ particleCount: 40, spread: 50, origin: { y: 0.7 } });

        if (currentStep < quizData.length) {
          loadQuiz();
        } else {
          showClearStage();
        }
      } else {
        errorMsg.classList.remove('hidden');
      }
    }

    function showClearStage() {
      document.getElementById('quiz-stage').classList.add('hidden');
      document.getElementById('message-stage').classList.remove('hidden');
      confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
      initEscapeButton();
    }

    function initEscapeButton() {
      const btn = document.getElementById('escape-btn');
      const card = document.getElementById('main-card');
      const rect = card.getBoundingClientRect();
      
      btn.style.left = `${rect.left + (rect.width / 2) - 80}px`;
      btn.style.top = `${rect.bottom - 40}px`;

      btn.addEventListener('mouseenter', () => {
        if (escapeCount < 5) {
          const x = Math.random() * (window.innerWidth - 180);
          const y = Math.random() * (window.innerHeight - 80);
          btn.style.left = `${x}px`;
          btn.style.top = `${y}px`;
          escapeCount++;

          if (escapeCount === 5) {
            btn.innerText = "参りました！クリックしてね";
            btn.style.background = "#22c55e";
            btn.style.boxShadow = "0 10px 25px rgba(34, 197, 94, 0.4)";
          }
        }
      });
    }

    function finalClick() {
      window.location.href = "album.html";
    }

    // 起動時認証チェック
    window.addEventListener("DOMContentLoaded", authenticate);
  </script>
</body>
</html>
